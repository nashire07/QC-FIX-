const SUPABASE_URL = "https://zhtwaknrnlhqaufjvhnt.supabase.co";

const sb = async (path, options = {}) => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: options.prefer || "return=representation",
      ...options.headers,
    },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Request failed: ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
};

const today = new Date();
const avgScore = (scores) => { const v = Object.values(scores); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1) : 0; };
const getStatus = (d) => { if (!d) return "overdue"; const days=(today-new Date(d))/86400000; return days<=50?"on-time":days<=60?"due-soon":"overdue"; };
const nextDue   = (d) => { if (!d) return "—"; const x=new Date(d); x.setDate(x.getDate()+60); return x.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}); };
const fmtDate   = (d) => d ? new Date(d).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const dlCSV     = (rows,fn) => { const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=fn; a.click(); };

const dlXLSX = (sheetsArr, filename) => {
  const wb = XLSX.utils.book_new();
  sheetsArr.forEach(({name, rows}) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    // Auto column widths
    const colWidths = rows[0]?.map((_,ci) => ({
      wch: Math.min(40, Math.max(10, ...rows.map(r => String(r[ci]??'').length)))
    }));
    if(colWidths) ws['!cols'] = colWidths;
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, filename);
};

function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [mob, setMob] = useState(false);
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [mitras, setMitras] = useState([]);
  const [categories, setCategories] = useState([]);
  const [allSubs, setAllSubs] = useState([]);
  const [evals, setEvals] = useState([]);
  const [scores, setScores] = useState([]);
  const [loading, setLoading] = useState(true);

  const tip = (msg, type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const [m,c,s,e,sc] = await Promise.all([db.getMitras(),db.getCategories(),db.getSubs(),db.getEvaluations(),db.getScores()]);
      setMitras(m);
      setCategories(c.map(cat=>({...cat,subs:s.filter(sub=>sub.category_id===cat.id)})));
      setAllSubs(s); setEvals(e); setScores(sc);
    } catch(e) { tip("Failed to load: "+e.message,"err"); }
    finally { setLoading(false); }
  },[]);

  useEffect(()=>{ if(user && user.role!=="mitra") load(); else if(user?.role==="mitra") setLoading(false); },[user]);

  const scMap = useMemo(()=>{
    const m={};
    scores.forEach(s=>{ if(!m[s.evaluation_id]) m[s.evaluation_id]={}; m[s.evaluation_id][s.sub_competency_id]=s.score; });
    return m;
  },[scores]);

  const richEvals = useMemo(()=>evals.map(e=>({...e,mitraId:e.mitra_id,date:e.eval_date,scores:scMap[e.id]||{}})),[evals,scMap]);


  const owners=getOwners();
  const myEvals=useMemo(()=>{
    if(!user||user.role==="lead")return richEvals;
    const assignments=getAssignments();
    return richEvals.filter(e=>owners[e.id]===user.id||(assignments[user.id]||[]).includes(e.mitra_id));
  },[richEvals,user]);
  const lastOk = useCallback((mid)=>richEvals.filter(e=>e.mitra_id===mid&&e.status==="Approved").sort((a,b)=>new Date(b.eval_date)-new Date(a.eval_date))[0]||null,[richEvals]);

  const mStats = useMemo(()=>mitras.map(m=>{
    const last=lastOk(m.id);
    return {...m,employeeId:m.employee_id,joinDate:m.join_date,lastEval:last,evalStatus:getStatus(last?.eval_date),nextDue:nextDue(last?.eval_date),avgScore:last?avgScore(last.scores):null};
  }),[mitras,lastOk]);

  const counts = useMemo(()=>({
    total:mitras.length,onTime:mStats.filter(m=>m.evalStatus==="on-time").length,
    dueSoon:mStats.filter(m=>m.evalStatus==="due-soon").length,overdue:mStats.filter(m=>m.evalStatus==="overdue").length,
    pending:richEvals.filter(e=>e.status==="Submitted").length,
  }),[mStats,richEvals]);

  // Actions
  const saveMitra = async d => {
    try { if(d.id) await db.updateMitra(d.id,d); else await db.addMitra(d); tip(d.id?"Mitra updated ✅":"Mitra added ✅"); await load(); setModal(null); }
    catch(e){ tip(e.message,"err"); }
  };
  const delMitra = async id => { try{ await db.deleteMitra(id); tip("Mitra deleted"); await load(); }catch(e){tip(e.message,"err");} };

  const saveEval = async d => {
    try {
      let eid=d.id;
      if(eid){ await db.updateEval(eid,{...d,date:d.date}); await db.deleteScores(eid); }
      else { const r=await db.addEval({...d,officerId:user.id}); eid=r[0].id; }
      await db.addScores(eid,d.scores);
      tip(d.status==="Submitted"?"Submitted for approval 📤":"Saved as draft 💾");
      await load(); setModal(null);
    } catch(e){ tip(e.message,"err"); }
  };

  const updStatus = async (id,status) => {
    try { await db.updateStatus(id,status); tip(status==="Approved"?"Approved ✅":"Status updated"); await load(); }
    catch(e){ tip(e.message,"err"); }
  };

  const saveCat = async cat => {
    try {
      let cid=cat.id;
      if(cid){ await db.updateCategory(cid,cat.name); await db.deleteSubs(cid); }
      else { const r=await db.addCategory(cat.name); cid=r[0].id; }
      for(let i=0;i<cat.subs.length;i++) await db.addSub(cid,cat.subs[i].name,i);
      tip("Category saved ✅"); await load(); setModal(null);
    } catch(e){ tip(e.message,"err"); }
  };
  const delCat = async id => { try{ await db.deleteCategory(id); tip("Deleted"); await load(); }catch(e){tip(e.message,"err");} };

  const expMitras = () => { const r=[["Name","ID","Last Eval","Score","Status","Next Due"]]; mStats.forEach(m=>r.push([m.name,m.employeeId||"—",m.lastEval?fmtDate(m.lastEval.eval_date):"Never",m.avgScore||"—",m.evalStatus,m.nextDue])); dlCSV(r,"qc_mitra.csv"); };
  const expEvals  = () => { const r=[["Mitra","Date","Score","Status","Notes"]]; richEvals.forEach(e=>{const m=mitras.find(x=>x.id===e.mitra_id); r.push([m?.name||"?",fmtDate(e.eval_date),avgScore(e.scores),e.status,e.notes||""]);}); dlCSV(r,"qc_evals.csv"); };

  if (!user) return <><style>{CSS}</style><Login onLogin={u=>{ setUser(u); setPage(u.role==="mitra"?"sensory":"dashboard"); }}/></>;
  if (loading && user.role!=="mitra") return <><style>{CSS}</style><div className="lscreen"><div className="spin"/><div style={{color:"var(--mut)",fontWeight:600}}>Loading from database…</div></div></>;

  const p = {user,mitras,mStats,evals:richEvals,myEvals,categories,allSubs,counts,setModal,setPage,delMitra,updStatus,delCat,expMitras,expEvals,saveMitra};

  return (
    <>
      <style>{CSS}</style>
      {toast&&<div style={{position:"fixed",top:20,right:20,zIndex:9999,padding:"12px 20px",borderRadius:12,fontWeight:700,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,.15)",background:toast.type==="err"?"#ffebee":"#e8f5e9",color:toast.type==="err"?"#c62828":"#2e7d32",border:"1.5px solid",borderColor:toast.type==="err"?"#ef9a9a":"#a5d6a7"}}>{toast.msg}</div>}
      <div className="app">
        <aside className="sidebar"><Nav page={page} setPage={setPage} user={user} onLogout={()=>{setUser(null);setPage("dashboard");}}/></aside>
        <div className={`mob-ov ${mob?"open":""}`} onClick={()=>setMob(false)}/>
        <div className={`mob-sb ${mob?"open":""}`}><Nav page={page} setPage={setPage} user={user} onLogout={()=>{setUser(null);setPage("dashboard");}} onClose={()=>setMob(false)}/></div>
        <main className="main">
          <div className="topbar">
            <button className="hbg" onClick={()=>setMob(true)}>☰</button>
            <span className="tb-t">QC <span>Matrix</span></span><div className="sp"/>
            <div className="av" style={{width:30,height:30,fontSize:13}}>{user.name[0]}</div>
          </div>
          {user.role!=="mitra" && page==="dashboard"    && <Dash {...p}/>}
          {user.role!=="mitra" && page==="mitras"       && <Mitras {...p}/>}
          {user.role!=="mitra" && page==="evaluations"  && <Evals {...p}/>}
          {user.role!=="mitra" && page==="competencies" && <Comps {...p} saveCat={saveCat}/>}
          {user.role!=="mitra" && page==="analytics"    && <Analytics {...p}/>}
          {user.role!=="mitra" && page==="heatmap"      && <Heatmap {...p}/>}
          {page==="sensory" && <SensoryPage user={user}/>}
        </main>
      </div>
      {modal?.type==="mitra-form"   && <MitraForm   data={modal.data} onSave={saveMitra} onClose={()=>setModal(null)}/>}
      {modal?.type==="eval-wizard"  && <EvalWizard  data={modal.data} mitras={mitras} categories={categories} allSubs={allSubs} user={user} onSave={saveEval} onClose={()=>setModal(null)}/>}
      {modal?.type==="mitra-detail" && <MitraDetail mitra={modal.data} evals={richEvals.filter(e=>e.mitra_id===modal.data.id)} categories={categories} allSubs={allSubs} onClose={()=>setModal(null)} setModal={setModal}/>}
      {modal?.type==="cat-form"     && <CatForm     data={modal.data} onSave={saveCat} onClose={()=>setModal(null)}/>}
      {modal?.type==="eval-detail"  && <EvalDetail  ev={modal.data} mitras={mitras} categories={categories} onClose={()=>setModal(null)}/>}
    </>
  );
}

      {["all","on-time","due-soon","overdue"].map(x=><button key={x} className={`btn sm ${f===x?"btn-p":"btn-g"}`} onClick={()=>setF(x)}>{x==="all"?"All":x==="on-time"?"✅ On Time":x==="due-soon"?"⏳ Due Soon":"⚠️ Overdue"}</button>)}

    <div className="card"><div className="tw"><table><thead><tr><th>Mitra</th><th>ID</th><th>Join Date</th><th>Last Eval</th><th>Score</th><th>Status</th><th>Actions</th></tr></thead>

          <td style={{fontSize:12,color:"var(--mut)"}}>{m.joinDate||"—"}</td>
          <td style={{fontSize:12}}>{m.lastEval?fmtDate(m.lastEval.eval_date):<span style={{color:"var(--red)"}}>Never</span>}</td>
          <td style={{fontWeight:700}}>{m.avgScore||<span style={{color:"var(--mut)"}}>—</span>}</td>
          <td><span className={`badge ${m.evalStatus}`}>{m.evalStatus==="on-time"?"✅ On Time":m.evalStatus==="due-soon"?"⏳ Due Soon":"⚠️ Overdue"}</span></td>
          <td><div className="gr">
            <button className="btn btn-g xs" onClick={()=>setModal({type:"mitra-detail",data:m})}>View</button>

}

function Evals({ evals, myEvals, mitras, user, setModal, updStatus, expEvals, categories, allSubs }) {
  const [tab, setTab] = useState('all');
  const display = user.role === 'assessor' ? myEvals : evals;
  const owners = getOwners();
  const list = [...display]
    .filter(e => tab === 'all' || e.status === tab)
    .sort((a, b) => new Date(b.eval_date) - new Date(a.eval_date));

  const exportAssessmentXLSX = () => {
    const subNames = (allSubs||[]).map(s=>s.name);
    const headerRow = ["Mitra","Tanggal","Status","Assessor","Overall Score", ...subNames, "Notes"];
    const dataRows = [...evals].sort((a,b)=>new Date(b.eval_date)-new Date(a.eval_date)).map(e => {
      const m = mitras.find(x=>x.id===e.mitra_id);
      const aName = getAssessorName(e) || "JL";
      const {notes} = parseNotes(e.notes||"");
      const subScores = (allSubs||[]).map(s=>e.scores?.[s.id]??0);
      return [m?.name||"?", fmtDate(e.eval_date), e.status, aName, avgScore(e.scores), ...subScores, notes||""];
    });
    // Sheet 2: latest per mitra summary
    const latestPerMitra = {};
    evals.filter(e=>e.status==="Approved").forEach(e=>{
      if(!latestPerMitra[e.mitra_id]||new Date(e.eval_date)>new Date(latestPerMitra[e.mitra_id].eval_date))
        latestPerMitra[e.mitra_id]=e;
    });
    const summaryRows = [
      ["Mitra","Last Eval Date","Overall Score","Status",...(categories||[]).map(c=>c.name)],
      ...Object.values(latestPerMitra).map(e=>{
        const m=mitras.find(x=>x.id===e.mitra_id);
        const catAvgs=(categories||[]).map(cat=>{
          const subs=cat.subs||[];
          return subs.length?Number((subs.reduce((s,sub)=>s+(e.scores?.[sub.id]||0),0)/subs.length).toFixed(2)):0;
        });
        return [m?.name||"?",fmtDate(e.eval_date),avgScore(e.scores),e.status,...catAvgs];
      })
    ];
    const dateStr = new Date().toLocaleDateString("id-ID").replace(/\//g,"-");
    dlXLSX([
      {name:"All Assessments", rows:[headerRow,...dataRows]},
      {name:"Summary (Approved)", rows:summaryRows}
    ], `Assessment_Results_${dateStr}.xlsx`);
  };
  return (
    <div className="page">
      <div className="ph row">
        <div><div className="pt">📋 Evaluations</div><div className="ps">{user.role==="assessor"?"Your assessments":"All competency assessments"}</div></div>
        <div className="sp" />
        <button className="btn btn-g sm" onClick={exportAssessmentXLSX}>⬇ Export Excel</button>
        {user.role==="lead" && <button className="btn btn-g sm" onClick={expEvals}>⬇ CSV</button>}
        <button className="btn btn-p" onClick={() => setModal({ type: 'eval-wizard', data: {} })}>+ New Evaluation</button>
      </div>
      <div className="tabs">
        {['all','Draft','Submitted','Approved'].map(t => (
          <button key={t} className={`tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>
            {t==='all'?'All':t}
            <span style={{marginLeft:6,fontSize:10,background:"var(--sur2)",borderRadius:99,padding:"1px 7px"}}>
              {t==='all'?display.length:display.filter(e=>e.status===t).length}
            </span>
          </button>
        ))}
      </div>
      <div className="card"><div className="tw"><table><thead><tr>
        <th>Mitra</th><th>Date</th><th>Score</th><th>Assessor</th><th>Notes</th><th>Status</th><th>Actions</th>
      </tr></thead>
        <tbody>
          {list.length === 0 && <tr><td colSpan={7}><div className="es"><div className="ei">📋</div>No evaluations</div></td></tr>}
          {list.map(e => {
            const m = mitras.find(x => x.id === e.mitra_id);
            const aName = getAssessorName(e);
            const { notes } = parseNotes(e.notes || '');
            return (
              <tr key={e.id}>
                <td><div className="row"><div className="av">{m?.name?.[0]||'?'}</div><span style={{fontWeight:600}}>{m?.name||'Unknown'}</span></div></td>
                <td style={{fontSize:12}}>{fmtDate(e.eval_date)}</td>
                <td style={{fontWeight:700}}>{avgScore(e.scores)}/5</td>
                <td>{aName ? <span className="chip chip-blue">📋 {aName}</span> : <span style={{color:"var(--mut)",fontSize:12}}>JL</span>}</td>
                <td style={{fontSize:12,color:"var(--mut)",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{notes||'—'}</td>
                <td><span className={`badge ${e.status}`}>{e.status}</span></td>
                <td><div className="gr">
                  <button className="btn btn-g xs" onClick={() => setModal({ type: 'eval-detail', data: e })}>Details</button>
                  {user.role==="lead" && e.status==="Submitted" && (
                    <button className="btn btn-ok xs" onClick={() => updStatus(e.id, 'Approved')}>✅ Validate</button>
                  )}
                  {e.status === 'Draft' && (user.role==="lead" || (user.role==="assessor" && owners[e.id]===user.id)) && (
                    <button className="btn btn-g xs" onClick={() => setModal({ type: 'eval-wizard', data: e })}>Edit</button>
                  )}
                </div></td>
              </tr>
            );
          })}
        </tbody>
      </table></div></div>
    </div>
  );
}

function Analytics({mitras,evals,categories,allSubs}){
  const [sel,setSel]=useState(mitras[0]?.id||"");
  const [sensoryResults,setSensoryResults]=useState(loadSR());
  useEffect(()=>{ fetchSR().then(setSensoryResults); },[]);
  const me=evals.filter(e=>e.mitra_id===sel&&e.status==="Approved").sort((a,b)=>new Date(a.eval_date)-new Date(b.eval_date));
  const latest=me[me.length-1], prev=me[me.length-2];
  const mitra=mitras.find(m=>m.id===sel);
  const mitraSens=[...sensoryResults].filter(r=>r.mitraId===sel||r.name===mitra?.name).sort((a,b)=>a.timestamp-b.timestamp);
  const sLast=mitraSens[mitraSens.length-1], sPrev=mitraSens[mitraSens.length-2];
  const sensCat=categories.find(c=>/sensory/i.test(c.name));
  const subSensScore=(subName,res)=>{
    if(!res) return null;
    const n=(subName||"").toLowerCase();
    const topic=SENSORY_TOPICS.find(t=>n.includes(t.id)||n.includes(t.label.toLowerCase().split(" ")[0]));
    const v=topic?res.topicScores?.[topic.id]:res.totalScore;
    return v!=null?Number((v*5).toFixed(1)):null;
  };
  const rd=categories.map(cat=>{
    if(sensCat&&cat.id===sensCat.id){
      return {subject:cat.name.replace(" Process",""),current:sLast?Number((sLast.totalScore*5).toFixed(1)):0,previous:sPrev?Number((sPrev.totalScore*5).toFixed(1)):0,fullMark:5};
    }
    return {subject:cat.name.replace(" Process",""),current:latest?Number((cat.subs.reduce((s,sub)=>s+(latest.scores[sub.id]||0),0)/cat.subs.length).toFixed(1)):0,previous:prev?Number((cat.subs.reduce((s,sub)=>s+(prev.scores[sub.id]||0),0)/cat.subs.length).toFixed(1)):0,fullMark:5};
  });
  const ss=allSubs.map(sub=>{
    if(sensCat&&sub.category_id===sensCat.id){
      return {name:sub.name,current:subSensScore(sub.name,sLast)??0,previous:subSensScore(sub.name,sPrev)??0};
    }
    return {name:sub.name,current:latest?(latest.scores[sub.id]||0):0,previous:prev?(prev.scores[sub.id]||0):0};
  }).sort((a,b)=>a.current-b.current);
  const wk=ss.filter(s=>s.current<4).slice(0,3);
  const td=me.map(e=>({date:fmtDate(e.eval_date),avg:Number(avgScore(e.scores))}));
  const hasData=latest||sLast;
  return <div className="page">
    <div className="ph"><div className="pt">📊 Analytics & Insights</div><div className="ps">Competency visualization per Mitra</div></div>
    <div className="fg" style={{maxWidth:280,marginBottom:20}}><label className="fl">Select Mitra</label>
      <select className="fse" value={sel} onChange={e=>setSel(e.target.value)}>{mitras.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
    </div>
    {!hasData?<div className="es card"><div className="ei">📊</div>No approved evaluations yet.</div>:<>
      <div className="g2" style={{gap:16,marginBottom:16}}>
        <div className="card"><div className="ct">🕸️ Radar — {mitra?.name}</div>
          <div className="rw"><ResponsiveContainer width="100%" height="100%"><RadarChart data={rd}>
            <PolarGrid stroke="#b8d9f0"/><PolarAngleAxis dataKey="subject" tick={{fill:"var(--mut)",fontSize:11}}/>
            <PolarRadiusAxis angle={90} domain={[0,5]} tick={{fill:"var(--mut)",fontSize:10}} tickCount={6}/>
            <Radar name="Current" dataKey="current" stroke="#2196f3" fill="#2196f3" fillOpacity={0.18} strokeWidth={2.5}/>
            {prev&&<Radar name="Previous" dataKey="previous" stroke="#ff9800" fill="#ff9800" fillOpacity={0.10} strokeWidth={1.5} strokeDasharray="5 3"/>}
            <Tooltip contentStyle={{background:"#fff",border:"1.5px solid var(--bdr)",borderRadius:10,fontSize:12}}/><Legend/>
          </RadarChart></ResponsiveContainer></div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div className="card"><div className="ct">📈 Scores</div>
            {ss.map(s=><div key={s.name} style={{marginBottom:10}}>
              <div className="row" style={{marginBottom:4}}><span style={{fontSize:12,fontWeight:600}}>{s.name}</span><div className="sp"/>
                <span style={{fontSize:11,fontWeight:800,color:s.current>=4?"var(--grn)":s.current>=3?"var(--org)":"var(--red)"}}>{s.current}/5</span>
                {prev&&<span style={{fontSize:10,color:"var(--mut)"}}>{s.current>s.previous?"↑":s.current<s.previous?"↓":"→"}</span>}
              </div>
              <div className="pb"><div className="pf" style={{width:`${(s.current/5)*100}%`,background:s.current>=4?"var(--grn)":s.current>=3?"var(--org)":"var(--red)"}}/></div>
            </div>)}
          </div>
          {wk.length>0&&<div className="card" style={{border:"1.5px solid #ffcdd2",background:"#fff9f9"}}>
            <div className="ct" style={{color:"var(--red)"}}>🎯 Training Needed</div>
            <div style={{fontSize:13,lineHeight:1.7}}><strong>{mitra?.name}</strong> needs improvement in:
              <ul style={{marginTop:8,paddingLeft:16}}>{wk.map(w=><li key={w.name} style={{color:"var(--org)",fontWeight:600}}>{w.name} <span style={{color:"var(--mut)",fontWeight:400}}>({w.current}/5)</span></li>)}</ul>
            </div>
          </div>}
        </div>
      </div>
      {td.length>=2&&<div className="card"><div className="ct">📉 Score Trend</div>
        <div style={{height:200}}><ResponsiveContainer width="100%" height="100%"><LineChart data={td}>
          <CartesianGrid stroke="#e3f2fd" strokeDasharray="4 4"/>
          <XAxis dataKey="date" tick={{fill:"var(--mut)",fontSize:11}}/><YAxis domain={[0,5]} tick={{fill:"var(--mut)",fontSize:11}}/>
          <Tooltip contentStyle={{background:"#fff",border:"1.5px solid var(--bdr)",borderRadius:10,fontSize:12}}/>
          <Line type="monotone" dataKey="avg" stroke="#2196f3" strokeWidth={2.5} dot={{fill:"#2196f3",r:5}} name="Avg Score"/>
        </LineChart></ResponsiveContainer></div>
      </div>}
    </>}
  </div>;
}

function Heatmap({mitras,evals,allSubs,categories}){
  const hc=s=>!s?"#e0e0e0":s>=4.5?"#00c853":s>=3.5?"#64dd17":s>=2.5?"#ffc107":s>=1.5?"#ff9800":"#f44336";
  const lo=mid=>evals.filter(e=>e.mitra_id===mid&&e.status==="Approved").sort((a,b)=>new Date(b.eval_date)-new Date(a.eval_date))[0]||null;
  const data=mitras.map(m=>({mitra:m,scores:allSubs.reduce((acc,sub)=>{const l=lo(m.id);acc[sub.id]=l?(l.scores[sub.id]||0):null;return acc},{})}));
  return <div className="page">
    <div className="ph"><div className="pt">🗺️ Team Skill Heatmap</div><div className="ps">Competency gaps across all Mitra</div></div>
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12,fontWeight:700,color:"var(--mut)"}}>Score:</span>
      {[["#f44336","1"],["#ff9800","2"],["#ffc107","3"],["#64dd17","4"],["#00c853","5"],["#e0e0e0","No data"]].map(([c,l])=><div key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,fontWeight:600}}><div style={{width:16,height:16,borderRadius:4,background:c}}/>{l}</div>)}
    </div>
    <div className="card" style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"separate",borderSpacing:4}}>
        <thead>
          <tr><th style={{textAlign:"left",padding:"6px 10px",fontSize:11,color:"var(--mut)",fontWeight:700,minWidth:130}}>Mitra</th>
            {categories.map(cat=><th key={cat.id} colSpan={cat.subs.length} style={{textAlign:"center",padding:"4px 6px",fontSize:10,color:"var(--acc)",fontWeight:800,textTransform:"uppercase",background:"#e3f2fd",borderRadius:6}}>{cat.name.replace(" Process","")}</th>)}
          </tr>
          <tr><th/>{allSubs.map(sub=><th key={sub.id} style={{fontSize:9,fontWeight:700,color:"var(--mut)",padding:"4px 6px",textAlign:"center",maxWidth:80}}>{sub.name.length>12?sub.name.slice(0,11)+"…":sub.name}</th>)}</tr>
        </thead>
        <tbody>{data.map(row=><tr key={row.mitra.id}>
          <td style={{fontWeight:700,fontSize:13,padding:"6px 10px",whiteSpace:"nowrap"}}>
            <div className="row"><div className="av" style={{width:28,height:28,fontSize:12}}>{row.mitra.name[0]}</div>{row.mitra.name}</div>
          </td>
          {allSubs.map(sub=>{const s=row.scores[sub.id]; return <td key={sub.id} style={{padding:3,textAlign:"center"}}><div className="hc" style={{background:hc(s),width:44,height:34,margin:"0 auto",color:"#fff",fontSize:13,fontWeight:800,borderRadius:7}}>{s||"—"}</div></td>;})}
        </tr>)}</tbody>
      </table>
    </div>
  </div>;
}

function EvalWizard({ data, mitras, categories, allSubs, user, onSave, onClose }) {
  const emptyScores = {};
  allSubs.forEach(s => emptyScores[s.id] = 3);
  const [step, setStep] = useState(1);
  const [busy, setBusy] = useState(false);
  const [hasDraft, setHasDraft] = useState(false);
  const [form, setForm] = useState({
    mitraId: data?.mitraId || data?.mitra_id || '',
    date: data?.eval_date || new Date().toISOString().split('T')[0],
    status: 'Draft',
    notes: parseNotes(data?.notes || '').notes,
    id: data?.id || null,
    scores: { ...emptyScores, ...(data?.scores || {}) }
  });
  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setScore = (sid, v) => setForm(f => ({ ...f, scores: { ...f.scores, [sid]: v } }));
  const selMitra = mitras.find(m => m.id === form.mitraId);
  const steps = ['Select Mitra', 'Score Competencies', 'Review & Submit'];

  // draft helpers
  const draftKey = DRAFT_KEY(user.id, form.mitraId);
  const checkDraft = (mid) => {
    if (!mid || data?.id) return;
    if (LS.get(DRAFT_KEY(user.id, mid))) setHasDraft(true);
  };
  const restoreDraft = () => {
    const saved = LS.get(DRAFT_KEY(user.id, form.mitraId));
    if (saved) { setForm(saved.form); setStep(saved.step || 1); }
    setHasDraft(false);
  };
  // auto-save every 1.5s after change
  useEffect(() => {
    if (!form.mitraId || data?.id) return;
    const t = setTimeout(() => LS.set(DRAFT_KEY(user.id, form.mitraId), { form, step, savedAt: new Date().toISOString() }), 1500);
    return () => clearTimeout(t);
  }, [form, step]);

  const doSave = async (st) => { setBusy(true); try { await onSave({ ...form, status: st }); } finally { setBusy(false); } };
  const overall = avgScore(form.scores);

  return (
    <div className="mb"><div className="mo mol">
      <button className="mc" onClick={onClose}>✕</button>
      <div className="mt2">{data?.id ? 'Edit Evaluation' : 'New Evaluation'}</div>

      {hasDraft && (
        <div className="draft-banner">
          <span>💾</span>
          <div style={{flex:1}}>Draft tersimpan ditemukan untuk mitra ini.</div>
          <button className="btn btn-warn xs" onClick={restoreDraft}>Lanjutkan Draft</button>
          <button className="btn btn-g xs" onClick={() => setHasDraft(false)}>Mulai Baru</button>
        </div>
      )}
      {form.mitraId && !data?.id && (
        <div style={{fontSize:11,color:"var(--mut)",marginBottom:12,textAlign:"right"}}>💾 Draft tersimpan otomatis</div>
      )}

      <div className="ws" style={{marginBottom:24}}>
        {steps.map((label, i) => {
          const n = i + 1, done = step > n, active = step === n;
          return (
            <div key={n} className="wst">
              <div className={`wc ${done ? 'done' : active ? 'active' : 'pend'}`}>{done ? '✓' : n}</div>
              <span className={`wl ${active ? 'active' : ''}`}>{label}</span>
              {i < steps.length - 1 && <div className={`wln ${done ? 'done' : ''}`} />}
            </div>
          );
        })}
      </div>

      {step === 1 && (
        <div>
          <div className="fg">
            <label className="fl">Select Mitra {user.role==="assessor" && <span style={{color:"var(--org)"}}>· assigned to you</span>}</label>
            <select className="fse" value={form.mitraId} onChange={e => { setF('mitraId', e.target.value); checkDraft(e.target.value); }}>
              <option value="">Choose a Mitra…</option>
              {mitras.map(m => <option key={m.id} value={m.id}>{m.name} ({m.employee_id})</option>)}
            </select>
          </div>
          {mitras.length === 0 && user.role === "assessor" && (
            <div className="al aw"><span>⚠️</span>Kamu belum di-assign ke mitra manapun. Hubungi Jr Lead.</div>
          )}
          {selMitra && (
            <div style={{background:"#e3f2fd",borderRadius:12,padding:16,border:"1.5px solid #90caf9",marginTop:8}}>
              <div className="row">
                <div className="av" style={{width:44,height:44,fontSize:18}}>{selMitra.name[0]}</div>

function MitraDetail({mitra:m, evals, categories, allSubs, onClose, setModal}){
  const sorted = [...evals].sort((a,b)=>new Date(b.eval_date)-new Date(a.eval_date));
  const latest = sorted[0];
  const avg = latest ? avgScore(latest.scores) : null;
  const statusColor = m.evalStatus==='overdue'?'var(--red)':m.evalStatus==='due-soon'?'var(--org)':'var(--grn)';

  // Per-category averages across all approved evals
  const catAvgs = categories.map(cat=>{
    const approved = sorted.filter(e=>e.status==='Approved');
    if(!approved.length) return {cat, avg:null};
    const catAvg = approved.reduce((sum,e)=>{
      const subs = cat.subs||[];
      const s = subs.length ? subs.reduce((ss,sub)=>ss+(e.scores?.[sub.id]||0),0)/subs.length : 0;
      return sum+s;
    },0)/approved.length;
    return {cat, avg:catAvg.toFixed(1)};
  });

  return <div className="mb"><div className="mo mol" style={{maxWidth:680}}>
    <button className="mc" onClick={onClose}>✕</button>
    <div className="mt2">Mitra Profile</div>

    {/* Header card */}

      <div className="av" style={{width:54,height:54,fontSize:22,flexShrink:0}}>{m.name?.[0]||"?"}</div>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:17}}>{m.name}</div>
        <div style={{fontSize:12,color:"var(--mut)",marginTop:2}}>ID: {m.employee_id||m.employeeId||"—"} · Joined: {fmtDate(m.join_date||m.joinDate)}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:11,color:"var(--mut)",marginBottom:4}}>Status</div>
        <span style={{background:statusColor+'22',color:statusColor,borderRadius:20,padding:"4px 12px",fontWeight:700,fontSize:12,textTransform:"capitalize"}}>
          {m.evalStatus==='overdue'?'⚠️ Overdue':m.evalStatus==='due-soon'?'🔔 Due Soon':'✅ On Time'}
        </span>
      </div>
    </div>

    {/* Stats row */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
      {[
        {label:"Total Evals", val:evals.length},
        {label:"Latest Score", val:avg?`${avg}/5`:"—"},
        {label:"Next Due", val:m.nextDue||"—"},
      ].map(({label,val})=><div key={label} style={{background:"var(--sur2)",borderRadius:12,padding:"14px 16px",textAlign:"center"}}>
        <div style={{fontSize:20,fontWeight:800,color:"var(--acc)"}}>{val}</div>

    {catAvgs.some(c=>c.avg!==null)&&<div style={{marginBottom:20}}>
      <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:12,color:"var(--mut)",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Competency Avg (Approved Evals)</div>
      {catAvgs.map(({cat,avg:ca})=><div key={cat.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
        <div style={{width:140,fontSize:12,color:"var(--tx)",flexShrink:0}}>{cat.name}</div>
        <div style={{flex:1,height:8,background:"var(--bdr)",borderRadius:4,overflow:"hidden"}}>

        </div>

// SENSORY EVALUATION PAGE
// ══════════════════════════════════════════════════════
const SENSORY_TOPICS = [
  { id:"rasa",  label:"5 Rasa Dasar",  emoji:"👅", weight:0.30, color:"#b4a7e8", group:"rasa" },
  { id:"rank",  label:"Ranking Test",  emoji:"🏆", weight:0.40, color:"#fbd29a", group:"rank" },
  { id:"tri",   label:"Triangle Test", emoji:"🔺", weight:0.30, color:"#9ed4c8", group:"tri"  },
];

// localStorage cache keys
const SQ_KEY = "sensory_questions_v1";
const SR_KEY = "sensory_results_v1";

function loadSQCache() { try { return JSON.parse(localStorage.getItem(SQ_KEY)) || {}; } catch { return {}; } }
function saveSQCache(data) { localStorage.setItem(SQ_KEY, JSON.stringify(data)); }
function loadSR() { try { return JSON.parse(localStorage.getItem(SR_KEY)) || []; } catch { return []; } }
function saveSR(arr) { localStorage.setItem(SR_KEY, JSON.stringify(arr)); }

// Convert flat DB rows -> {topicId: [{id, question, options, correct, sort_order}, ...]}
function mapSQ(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.topic_id]) map[r.topic_id] = [];
    map[r.topic_id].push({ id: r.id, question: r.question, options: r.options, correct: r.correct, sort_order: r.sort_order });
  });
  return map;
}
async function fetchSQ() {
  try { const rows = await db.getQuestions(); const map = mapSQ(rows); saveSQCache(map); return map; }
  catch(e) { console.warn("fetchSQ fallback to cache", e); return loadSQCache(); }
}

function mapSR(rows) { return rows.map(r=>({ id:r.id, mitraId:r.mitra_id, name:r.mitra_name, timestamp:new Date(r.created_at).getTime(), topicScores:r.topic_scores||{}, totalScore:Number(r.total_score)||0 })); }
async function fetchSR() {
  try { const rows = await db.getSensory(); const arr = mapSR(rows); saveSR(arr); return arr; }
  catch(e) { console.warn("fetchSR fallback to cache", e); return loadSR(); }
}

function SensoryPage({ user }) {
  const isLead = user.role === "lead" || user.role === "assessor";
  const [tab, setTab] = useState(isLead ? "manage" : "quiz");
  const [questions, setQuestions] = useState(loadSQCache());
  const [results, setResults] = useState(loadSR());
  const [qLoading, setQLoading] = useState(true);

  useEffect(()=>{
    fetchSR().then(setResults);
    fetchSQ().then(q=>{ setQuestions(q); setQLoading(false); });
  },[]);

  const reloadQuestions = async () => { const q = await fetchSQ(); setQuestions(q); };

  const saveResult = async (r) => {
    try { const rows = await db.addSensory(r); const mapped = mapSR(rows); const updated=[...results,...mapped]; setResults(updated); saveSR(updated); }
    catch(e) { const updated=[...results,r]; setResults(updated); saveSR(updated); alert("Gagal sync ke server: "+e.message); }
  };

  return (
    <div className="page">
      <div className="ph row">
        <div><div className="pt">👅 Sensory Evaluation</div>
          <div className="ps">
            {SENSORY_TOPICS.map(t=><span key={t.id} style={{marginRight:12,fontWeight:700,color:t.color}}>{t.emoji} {t.label} ({Math.round(t.weight*100)}%)</span>)}
          </div>
        </div>
      </div>
      {isLead ? (
        <>
          <div className="tabs">
            {[["manage","⚙️ Kelola Soal"],["results","📊 Hasil Quiz"]].map(([id,lbl])=>
              <button key={id} className={`tab ${tab===id?"active":""}`} onClick={()=>setTab(id)}>{lbl}</button>
            )}
          </div>
          {tab==="manage" && <SensoryManage questions={questions} reloadQuestions={reloadQuestions} qLoading={qLoading}/>}
          {tab==="results" && <SensoryResults results={results} setResults={r=>{setResults(r);saveSR(r);}}/>}
        </>
      ) : (
        <SensoryQuiz user={user} questions={questions} onDone={saveResult}/>
      )}
    </div>
  );
}

// ── LEAD: Manage Questions ──────────────────────────────
function SensoryManage({ questions, reloadQuestions, qLoading }) {
  const [activeTopic, setActiveTopic] = useState(SENSORY_TOPICS[0].id);
  const [editQ, setEditQ] = useState(null); // {topicId, qItem|null} — qItem has id when editing
  const [saving, setSaving] = useState(false);
  const topic = SENSORY_TOPICS.find(t=>t.id===activeTopic);
  const tQs = questions[activeTopic] || [];

  const addQ   = () => setEditQ({topicId:activeTopic, qItem:null});
  const editQi = (q) => setEditQ({topicId:activeTopic, qItem:q});
  const delQ   = async (q) => {
    if(!window.confirm("Hapus soal ini?")) return;
    try {
      await db.deleteQuestion(q.id);
      await reloadQuestions();
    } catch(e) { alert("Gagal hapus: "+e.message); }
  };
  const saveOneQ = async (topicId, qItem, qData) => {
    setSaving(true);
    try {
      if(qItem) {
        await db.updateQuestion(qItem.id, qData);
      } else {
        const existingCount = (questions[topicId]||[]).length;
        await db.addQuestion(topicId, qData, existingCount);
      }
      await reloadQuestions();
      setEditQ(null);
    } catch(e) { alert("Gagal simpan: "+e.message); }
    finally { setSaving(false); }
  };

  if(qLoading) return <div className="es card"><div className="spin" style={{borderColor:"rgba(21,101,192,.2)",borderTopColor:"var(--br)",width:32,height:32,borderWidth:3,margin:"0 auto 12px"}}/><div>Memuat soal...</div></div>;

  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        {SENSORY_TOPICS.map(t=><button key={t.id} onClick={()=>setActiveTopic(t.id)} style={{
          padding:"9px 18px",borderRadius:99,fontWeight:700,fontSize:14,cursor:"pointer",border:"2px solid",
          borderColor:activeTopic===t.id?t.color:"var(--bdr)",
          background:activeTopic===t.id?t.color:"var(--sur)",
          color:activeTopic===t.id?"#fff":"var(--txt)",transition:"all .15s"
        }}>{t.emoji} {t.label} <span style={{fontSize:11,opacity:.75}}>({Math.round(t.weight*100)}%)</span></button>)}
      </div>
      <div className="row" style={{marginBottom:16}}>
        <div style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:800,color:topic.color}}>{topic.emoji} {topic.label}</div>
        <span style={{background:"var(--sur2)",borderRadius:99,padding:"2px 10px",fontSize:11,fontWeight:700,color:"var(--mut)"}}>{tQs.length} soal</span>
        <div className="sp"/>
        <button className="btn btn-p" onClick={addQ}>+ Tambah Soal</button>
      </div>
      {tQs.length===0 && <div className="es card"><div className="ei">📝</div>Belum ada soal untuk topik ini. Tambahkan soal pertama!</div>}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {tQs.map((q,i)=><div key={q.id||i} className="card" style={{borderLeft:`4px solid ${topic.color}`}}>
          <div className="row" style={{marginBottom:10}}>
            <span style={{background:topic.color,color:"#fff",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>No. {i+1}</span>
            <span style={{fontWeight:700,fontSize:14,flex:1,marginLeft:4}}>{q.question}</span>
            <button className="btn btn-g xs" onClick={()=>editQi(q)}>✏️ Edit</button>
            <button className="btn btn-d xs" onClick={()=>delQ(q)}>🗑️</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:6}}>
            {q.options.map((opt,oi)=><div key={oi} style={{
              padding:"7px 12px",borderRadius:8,fontSize:13,fontWeight:600,
              background:oi===q.correct?"#e8f5e9":"#f5faff",
              border:`1.5px solid ${oi===q.correct?"#a5d6a7":"var(--bdr)"}`,
              color:oi===q.correct?"#2e7d32":"var(--txt)"
            }}>{oi===q.correct?"✅ ":""}{opt}</div>)}
          </div>
        </div>)}
      </div>
      {editQ && <QuestionFormModal topicId={editQ.topicId} qItem={editQ.qItem} onSave={saveOneQ} onClose={()=>setEditQ(null)} saving={saving}/>}
    </div>
  );
}

function QuestionFormModal({ topicId, qItem, onSave, onClose, saving }) {
  const [question, setQuestion] = useState(qItem?.question||"");
  const [options, setOptions] = useState(qItem?.options||["","","",""]);
  const [correct, setCorrect] = useState(qItem?.correct??0);
  const topic = SENSORY_TOPICS.find(t=>t.id===topicId);
  const setOpt = (i,v) => setOptions(p=>{const n=[...p];n[i]=v;return n;});
  const addOpt = () => setOptions(p=>[...p,""]);
  const delOpt = (i) => { setOptions(p=>p.filter((_,idx)=>idx!==i)); if(correct>=i&&correct>0) setCorrect(c=>c-1); };
  const valid = question.trim() && options.filter(o=>o.trim()).length>=2;
  return (
    <div className="mb"><div className="mo">
      <button className="mc" onClick={onClose}>✕</button>
      <div className="mt2">{qItem?"Edit Soal":"Tambah Soal Baru"}</div>
      <div style={{background:topic.color+"18",borderRadius:8,padding:"8px 12px",marginBottom:16,fontSize:12,fontWeight:700,color:topic.color}}>{topic.emoji} {topic.label}</div>
      <div className="fg"><label className="fl">Pertanyaan *</label>
        <textarea className="fta" value={question} onChange={e=>setQuestion(e.target.value)} placeholder="Tulis pertanyaannya di sini…"/>
      </div>
      <div className="fg"><label className="fl">Pilihan Jawaban</label>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {options.map((opt,i)=><div key={i} className="row">
            <button onClick={()=>setCorrect(i)} title="Tandai sebagai jawaban benar" style={{
              width:28,height:28,borderRadius:50,border:"2px solid",flexShrink:0,cursor:"pointer",
              borderColor:i===correct?"var(--grn)":"var(--bdr)",
              background:i===correct?"var(--grn)":"var(--sur)",color:"#fff",fontSize:13
            }}>{i===correct?"✓":""}</button>
            <input className="fi" value={opt} onChange={e=>setOpt(i,e.target.value)} placeholder={`Opsi ${String.fromCharCode(65+i)}`} style={{flex:1}}/>
            {options.length>2&&<button className="btn btn-d xs" onClick={()=>delOpt(i)}>✕</button>}
          </div>)}
        </div>
        <button className="btn btn-g sm" style={{marginTop:8}} onClick={addOpt}>+ Tambah Opsi</button>
        <div style={{fontSize:11,color:"var(--mut)",marginTop:6,fontWeight:600}}>💡 Klik lingkaran hijau untuk menandai jawaban yang benar</div>
      </div>
      <div className="row m16">
        <button className="btn btn-g" onClick={onClose} disabled={saving}>Batal</button><div className="sp"/>
        <button className="btn btn-p" disabled={!valid||saving} onClick={()=>onSave(topicId,qItem,{question:question.trim(),options,correct})}>
          {saving?<><span className="spin" style={{width:14,height:14,borderWidth:2}}/> Menyimpan...</>:"Simpan Soal"}
        </button>
      </div>
    </div></div>
  );
}

// ── LEAD: Summary Charts ────────────────────────────────
function SensorySummary({ results }) {
  // Compute total% per result (uses stored totalScore if present)
  const withTotals = results.map(r=>{
    const totalFrac = r.totalScore!=null ? r.totalScore : SENSORY_TOPICS.reduce((s,t)=>{
      const ts=r.topicScores?.[t.id]; return s+(ts!=null?ts*t.weight:0);
    },0);
    return { ...r, totalPct: Math.round(totalFrac*100) };
  });

  // PARETO — wrong% per category (avg 1-score across mitras)
  const paretoRaw = SENSORY_TOPICS.map(t=>{
    const scores = results.map(r=>r.topicScores?.[t.id]).filter(v=>v!=null);
    const avg = scores.length? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
    const wrongPct = Math.round((1-avg)*100);
    return { name:`${t.emoji} ${t.label}`, wrong:wrongPct, color:t.color };
  }).sort((a,b)=>b.wrong-a.wrong);
  const totalWrong = paretoRaw.reduce((s,x)=>s+x.wrong,0) || 1;
  let cum = 0;
  const paretoData = paretoRaw.map(x=>{ cum += x.wrong; return { ...x, cumPct: Math.round(cum/totalWrong*100) }; });
  const weakest = paretoData[0];

  // HISTOGRAM — per mitra total% (latest per mitra)
  const latestByMitra = {};
  withTotals.forEach(r=>{
    const k = r.mitraId || r.name;
    if(!latestByMitra[k] || r.timestamp > latestByMitra[k].timestamp) latestByMitra[k] = r;
  });
  const histData = Object.values(latestByMitra)
    .sort((a,b)=>b.totalPct-a.totalPct)
    .map(r=>({ name:r.name, score:r.totalPct }));

  // VENN — counts for A=rasa≥80%, B=tri≥80%, C=ranking≥80%
  const groupScore = (r,group) => {
    const ts = SENSORY_TOPICS.filter(t=>t.group===group);
    const totalW = ts.reduce((s,t)=>s+t.weight,0);
    let sum=0, has=false;
    ts.forEach(t=>{ const v=r.topicScores?.[t.id]; if(v!=null){ sum+=v*t.weight; has=true; } });
    return has ? sum/totalW : null;
  };
  const sets = { A:new Set(), B:new Set(), C:new Set() };
  Object.values(latestByMitra).forEach(r=>{
    const k = r.mitraId || r.name;
    const a=groupScore(r,"rasa"), b=groupScore(r,"rank"), c=groupScore(r,"tri");
    if(a!=null&&a>=0.8) sets.A.add(k);
    if(b!=null&&b>=0.8) sets.B.add(k);
    if(c!=null&&c>=0.8) sets.C.add(k);
  });
  const inter = (x,y) => [...x].filter(k=>y.has(k));
  const ABC = inter(sets.A, sets.B).filter(k=>sets.C.has(k));
  const onlyAB = inter(sets.A, sets.B).filter(k=>!sets.C.has(k));
  const onlyAC = inter(sets.A, sets.C).filter(k=>!sets.B.has(k));
  const onlyBC = inter(sets.B, sets.C).filter(k=>!sets.A.has(k));
  const onlyA = [...sets.A].filter(k=>!sets.B.has(k)&&!sets.C.has(k));
  const onlyB = [...sets.B].filter(k=>!sets.A.has(k)&&!sets.C.has(k));
  const onlyC = [...sets.C].filter(k=>!sets.A.has(k)&&!sets.B.has(k));

  const cardStyle = { marginBottom:16 };
  const titleStyle = { fontFamily:"var(--fh)", fontSize:15, fontWeight:800, marginBottom:4 };
  const subStyle = { fontSize:12, color:"var(--mut)", marginBottom:12 };

  // Map mitra key → display name (first name only to fit inside venn regions)
  const nameByKey = {};
  Object.values(latestByMitra).forEach(r=>{ nameByKey[r.mitraId||r.name] = (r.name||"").split(" ")[0]; });
  const renderNames = (keys, cx, cy) => {
    if(!keys.length) return null;
    const max = 4;
    const shown = keys.slice(0, max);
    const extra = keys.length - shown.length;
    const lh = 11;
    const startY = cy - ((shown.length-1)*lh)/2;
    return shown.map((k,i)=>(
      <text key={k+i} x={cx} y={startY + i*lh} fontSize="9.5" fontWeight="700" textAnchor="middle" fill="#2b3e5a">
        {i===max-1 && extra>0 ? `${nameByKey[k]||k} +${extra}` : (nameByKey[k]||k)}
      </text>
    ));
  };

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
      {/* PARETO */}
      <div className="card" style={{...cardStyle,gridColumn:"1 / -1"}}>
        <div style={titleStyle}>📉 Pareto — Kelemahan Panelis per Kategori</div>
        <div style={subStyle}>Kategori dengan jawaban salah terbanyak: <strong style={{color:weakest.color}}>{weakest.name}</strong> ({weakest.wrong}% salah)</div>
        <div style={{width:"100%",height:280}}>
          <ResponsiveContainer>
            <ComposedChart data={paretoData} margin={{top:10,right:30,left:0,bottom:5}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#eee"/>
              <XAxis dataKey="name" tick={{fontSize:11}}/>
              <YAxis yAxisId="left" label={{value:"% Salah",angle:-90,position:"insideLeft",fontSize:11}}/>
              <YAxis yAxisId="right" orientation="right" domain={[0,100]} label={{value:"Kumulatif %",angle:90,position:"insideRight",fontSize:11}}/>
              <Tooltip/>
              <Bar yAxisId="left" dataKey="wrong" name="% Salah">
                {paretoData.map((e,i)=><Cell key={i} fill={e.color}/>)}
                <LabelList dataKey="wrong" position="top" style={{fontSize:11,fontWeight:700}}/>
              </Bar>
              <Line yAxisId="right" type="monotone" dataKey="cumPct" name="Kumulatif %" stroke="#f4a8a8" strokeWidth={2} dot={{r:4}}/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* HISTOGRAM */}
      <div className="card" style={cardStyle}>
        <div style={titleStyle}>📊 Histogram — Total Skor per Mitra</div>
        <div style={subStyle}>Skor total (terbaru) tiap mitra</div>
        <div style={{width:"100%",height:280}}>
          <ResponsiveContainer>
            <BarChart data={histData} margin={{top:10,right:20,left:0,bottom:40}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#eee"/>
              <XAxis dataKey="name" tick={{fontSize:11}} interval={0} angle={-25} textAnchor="end"/>
              <YAxis domain={[0,100]} tick={{fontSize:11}}/>
              <Tooltip/>
              <Bar dataKey="score" name="Total %">
                {histData.map((e,i)=><Cell key={i} fill={e.score>=80?"#a8e0c2":e.score>=60?"#fbd29a":"#f4a8a8"}/>)}
                <LabelList dataKey="score" position="top" style={{fontSize:11,fontWeight:700}}/>
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* VENN */}
      <div className="card" style={cardStyle}>
        <div style={titleStyle}>🔵 Diagram Venn — Mitra ≥ 80%</div>
        <div style={subStyle}>A = Rasa Dasar · B = Ranking Test · C = Triangle Test</div>
        <div style={{width:"100%",height:320,display:"flex",justifyContent:"center",alignItems:"center"}}>
          <svg viewBox="0 0 360 300" style={{width:"100%",height:"100%"}}>
            <circle cx="135" cy="120" r="92" fill="#b4a7e8" fillOpacity="0.40" stroke="#9d8de0" strokeWidth="2"/>
            <circle cx="225" cy="120" r="92" fill="#9ed4c8" fillOpacity="0.40" stroke="#7ec5b5" strokeWidth="2"/>
            <circle cx="180" cy="200" r="92" fill="#f4b5a8" fillOpacity="0.40" stroke="#ed9b8a" strokeWidth="2"/>
            {/* labels */}
            <text x="60"  y="50"  fontSize="13" fontWeight="800" fill="#7d6dcc">A: Rasa</text>
            <text x="240" y="50"  fontSize="13" fontWeight="800" fill="#d49a3a">B: Ranking</text>
            <text x="148" y="290" fontSize="13" fontWeight="800" fill="#5fa897">C: Triangle</text>
            {/* names per region */}
            {renderNames(onlyA, 90, 105)}
            {renderNames(onlyB, 270, 105)}
            {renderNames(onlyC, 180, 235)}
            {renderNames(onlyAB, 180, 95)}
            {renderNames(onlyAC, 125, 185)}
            {renderNames(onlyBC, 235, 185)}
            {renderNames(ABC, 180, 155)}
          </svg>
        </div>
        <div style={{fontSize:11,color:"var(--mut)",textAlign:"center",marginTop:4}}>
          A∩B∩C: <strong>{ABC.length}</strong> · A only: {onlyA.length} · B only: {onlyB.length} · C only: {onlyC.length}
        </div>
      </div>
    </div>
  );
}

// ── LEAD: Results ───────────────────────────────────────
function SensoryResults({ results, setResults }) {
  const fmt = ts => new Date(ts).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const exportXLSX = () => {
    // Sheet 1: Summary per mitra (latest result only)
    const latestMap = {};
    results.forEach(r => {
      const k = r.mitraId || r.name;
      if(!latestMap[k] || r.timestamp > latestMap[k].timestamp) latestMap[k] = r;
    });
    const topicLabels = SENSORY_TOPICS.map(t=>`${t.emoji} ${t.label} (${Math.round(t.weight*100)}%)`);
    const summaryRows = [
      ["Nama Mitra", "Tanggal", ...topicLabels, "Total (%)"],
      ...Object.values(latestMap).sort((a,b)=>b.totalScore-a.totalScore).map(r => {
        const totalPct = Math.round((r.totalScore??0)*100);
        const topicCols = SENSORY_TOPICS.map(t => {
          const ts = r.topicScores?.[t.id];
          return ts!=null ? Math.round(ts*100)+"%" : "—";
        });
        return [r.name, new Date(r.timestamp).toLocaleDateString("id-ID"), ...topicCols, totalPct+"%"];
      })
    ];
    // Sheet 2: All raw results
    const allRows = [
      ["Nama Mitra","Tanggal & Waktu",...topicLabels,"Total (%)"],
      ...[...results].reverse().map(r => {
        const totalPct = Math.round((r.totalScore??0)*100);
        const topicCols = SENSORY_TOPICS.map(t => {
          const ts = r.topicScores?.[t.id];
          return ts!=null ? Math.round(ts*100)+"%" : "—";
        });
        return [r.name, new Date(r.timestamp).toLocaleString("id-ID"), ...topicCols, totalPct+"%"];
      })
    ];
    const dateStr = new Date().toLocaleDateString("id-ID").replace(/\//g,"-");
    dlXLSX([{name:"Summary (Latest)", rows:summaryRows},{name:"All Results", rows:allRows}], `Sensory_Results_${dateStr}.xlsx`);
  };
  const clear = async () => {
    if(!confirm("Hapus semua hasil quiz? Ini tidak bisa dibatalkan.")) return;
    try { for(const r of results){ if(r.id) await db.deleteSensory(r.id); } } catch(e){ alert("Gagal hapus di server: "+e.message); return; }
    setResults([]);
  };
  return (
    <div>
      <div className="row" style={{marginBottom:16}}>
        <div style={{fontFamily:"var(--fh)",fontSize:16,fontWeight:800}}>Hasil Quiz Mitra</div>
        <div className="sp"/>
        {results.length>0&&<button className="btn btn-g sm" onClick={exportXLSX}>⬇ Export Excel</button>}
        {results.length>0&&<button className="btn btn-d sm" onClick={clear}>🗑️ Hapus Semua</button>}
      </div>
      {results.length===0 && <div className="es card"><div className="ei">📊</div>Belum ada hasil quiz.</div>}
      {results.length>0 && <SensorySummary results={results}/>}
      {results.length>0&&<div className="card"><div className="tw"><table>
        <thead><tr><th>Nama</th><th>Tanggal</th>{SENSORY_TOPICS.map(t=><th key={t.id}>{t.emoji} {t.label}</th>)}<th>Total</th></tr></thead>
        <tbody>{[...results].reverse().map((r,i)=>{
          const totalFrac = r.totalScore!=null ? r.totalScore : SENSORY_TOPICS.reduce((sum,t)=>{
            const tScore=r.topicScores?.[t.id];
            return sum+(tScore!=null?(tScore*t.weight):0);
          },0);
          const totalPct = Math.round(totalFrac*100);
          return <tr key={i}>
            <td style={{fontWeight:700}}>{r.name}</td>
            <td style={{fontSize:12,color:"var(--mut)"}}>{fmt(r.timestamp)}</td>
            {SENSORY_TOPICS.map(t=>{
              const ts=r.topicScores?.[t.id];
              const pct=ts!=null?Math.round(ts*100):null;
              return <td key={t.id}><span style={{fontWeight:700,color:pct===null?"var(--mut)":pct>=70?"var(--grn)":pct>=50?"var(--org)":"var(--red)"}}>{pct!=null?pct+"%":"—"}</span></td>;
            })}
            <td><span style={{fontWeight:800,fontSize:15,color:totalPct>=70?"var(--grn)":totalPct>=50?"var(--org)":"var(--red)"}}>{totalPct}%</span></td>
          </tr>;
        })}</tbody>
      </table></div></div>}
    </div>
  );
}

// ── MITRA: Take Quiz ────────────────────────────────────
function SensoryQuiz({ user, questions, onDone }) {
  const [phase, setPhase] = useState("intro"); // intro | quiz | result
  const [topicIdx, setTopicIdx] = useState(0);
  const [answers, setAnswers] = useState({}); // {topicId: {qIdx: chosenIdx}}
  const [result, setResult] = useState(null);

  const allTopics = SENSORY_TOPICS.filter(t=>(questions[t.id]||[]).length>0);

  const startQuiz = () => {
    if(allTopics.length===0) return;
    setTopicIdx(0);
    setAnswers({});
    setPhase("quiz");
  };

  const setAnswer = (topicId, qIdx, chosen) => {
    setAnswers(prev=>({...prev,[topicId]:{...(prev[topicId]||{}),[qIdx]:chosen}}));
  };

  const finishQuiz = () => {
    const topicScores = {};
    let canFinish = true;
    for(const t of allTopics) {
      const qs = questions[t.id]||[];
      const ans = answers[t.id]||{};
      if(qs.length>0 && Object.keys(ans).length<qs.length){ canFinish=false; break; }
      const correct = qs.filter((q,i)=>ans[i]===q.correct).length;
      topicScores[t.id] = qs.length>0 ? correct/qs.length : null;
    }
    if(!canFinish){ alert("Jawab semua pertanyaan dulu ya!"); return; }
    const total = SENSORY_TOPICS.reduce((sum,t)=>{
      const ts=topicScores[t.id];
      return sum+(ts!=null?(ts*t.weight):0);
    },0);
    const r = { mitraId:user.id, name:user.name, timestamp:Date.now(), topicScores, totalScore:total };
    setResult(r);
    onDone(r);
    setPhase("result");
  };

  if(phase==="intro") return (
    <div style={{maxWidth:600,margin:"0 auto"}}>
      <div className="card" style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:60,marginBottom:16}}>👅</div>
        <div style={{fontFamily:"var(--fh)",fontSize:22,fontWeight:800,marginBottom:8}}>Halo, {user.name}! 👋</div>
        <div style={{color:"var(--mut)",fontSize:14,marginBottom:20,lineHeight:1.7}}>Kamu akan mengerjakan <strong>Sensory Evaluation Quiz</strong>.<br/>Quiz ini terdiri dari 4 sub-topik:</div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20,textAlign:"left"}}>
          {SENSORY_TOPICS.map(t=>{const qs=(questions[t.id]||[]).length; return <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:t.color+"22",borderRadius:12,border:`1.5px solid ${t.color}55`}}>
            <span style={{fontSize:24}}>{t.emoji}</span>
            <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{t.label}</div><div style={{fontSize:12,color:"var(--mut)"}}>Bobot {Math.round(t.weight*100)}% · {qs} soal</div></div>
            <span style={{background:t.color,color:"#fff",borderRadius:99,padding:"3px 11px",fontSize:11,fontWeight:700}}>{Math.round(t.weight*100)}%</span>
          </div>;})}
        </div>
        {/* INSTRUCTIONS */}
        <div style={{background:"#eaf3fc",border:"1.5px solid #c5dcf2",borderRadius:12,padding:"16px 18px",marginBottom:22,textAlign:"left"}}>
          <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:14,color:"var(--acc)",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>📋 Instruksi Quiz</div>
          <ol style={{paddingLeft:20,margin:0,fontSize:13,color:"var(--txt)",lineHeight:1.75,fontWeight:500}}>
            <li>Pastikan kondisi <strong>indera perasa</strong> dalam keadaan baik (tidak sedang sakit, makan, atau merokok 30 menit sebelum quiz).</li>
            <li>Kerjakan quiz di tempat yang <strong>tenang</strong> dan <strong>fokus</strong>.</li>
            <li>Jawab setiap soal dengan <strong>jujur</strong> sesuai persepsi sensori kamu — bukan tebak-tebakan.</li>
            <li>Quiz dikerjakan secara <strong>berurutan</strong> per sub-topik. Semua soal di satu topik harus dijawab sebelum lanjut.</li>
            <li>Tidak ada batas waktu, tapi usahakan menjawab dengan <strong>respon pertama</strong> kamu.</li>
            <li>Hasil akan langsung muncul di akhir, dan tersimpan otomatis untuk evaluasi QC Junior Lead.</li>
          </ol>
        </div>
        {allTopics.length===0
          ? <div className="al aw"><span>⚠️</span>Soal quiz belum tersedia. Hubungi QC Junior Lead.</div>
          : <button className="btn btn-p" style={{width:"100%",justifyContent:"center",fontSize:16,padding:"14px"}} onClick={startQuiz}>Mulai Quiz →</button>
        }
      </div>
    </div>
  );

  if(phase==="quiz") {
    const currentTopic = allTopics[topicIdx];
    const qs = questions[currentTopic.id]||[];
    const topicAnswers = answers[currentTopic.id]||{};
    const answeredCount = Object.keys(topicAnswers).length;
    const isLastTopic = topicIdx===allTopics.length-1;
    const allAnswered = answeredCount===qs.length;
    const goNext = () => {
      if(!allAnswered){ alert("Jawab semua soal di topik ini dulu ya!"); return; }
      if(isLastTopic) finishQuiz();
      else setTopicIdx(i=>i+1);
    };
    return (
      <div style={{maxWidth:700,margin:"0 auto"}}>
        {/* Progress */}
        <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
          {allTopics.map((t,i)=><div key={t.id} style={{
            flex:1,padding:"8px 12px",borderRadius:10,textAlign:"center",fontSize:12,fontWeight:700,
            background:i<topicIdx?"var(--grn)":i===topicIdx?t.color:"var(--sur2)",
            color:i<=topicIdx?"#fff":"var(--mut)",border:"1.5px solid",
            borderColor:i<topicIdx?"var(--grn)":i===topicIdx?t.color:"var(--bdr)"
          }}>{i<topicIdx?"✓ ":""}{t.emoji} {t.label}</div>)}
        </div>
        <div className="card" style={{borderTop:`4px solid ${currentTopic.color}`}}>
          <div className="row" style={{marginBottom:20}}>
            <div style={{fontFamily:"var(--fh)",fontSize:18,fontWeight:800,color:currentTopic.color}}>{currentTopic.emoji} {currentTopic.label}</div>
            <div className="sp"/>
            <span style={{fontSize:13,fontWeight:700,color:"var(--mut)"}}>{answeredCount}/{qs.length} dijawab</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            {qs.map((q,qi)=>{
              const chosen = topicAnswers[qi];
              return <div key={qi} style={{padding:"16px",background:"#f5faff",borderRadius:12,border:"1.5px solid var(--bdr)"}}>
                <div style={{fontWeight:700,fontSize:14,marginBottom:12,lineHeight:1.6}}><span style={{color:currentTopic.color,fontWeight:800}}>Q{qi+1}.</span> {q.question}</div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {q.options.map((opt,oi)=><button key={oi} onClick={()=>setAnswer(currentTopic.id,qi,oi)} style={{
                    padding:"10px 14px",borderRadius:9,fontSize:14,fontWeight:600,cursor:"pointer",textAlign:"left",border:"2px solid",transition:"all .13s",
                    borderColor:chosen===oi?currentTopic.color:"var(--bdr)",
                    background:chosen===oi?currentTopic.color+"18":"#fff",
                    color:chosen===oi?currentTopic.color:"var(--txt)"
                  }}>{String.fromCharCode(65+oi)}. {opt}</button>)}
                </div>
              </div>;
            })}
          </div>
          <div className="row m20">
            {topicIdx>0&&<button className="btn btn-g" onClick={()=>setTopicIdx(i=>i-1)}>← Sebelumnya</button>}
            <div className="sp"/>
            <button className="btn btn-p" onClick={goNext} style={{background:`linear-gradient(135deg,${currentTopic.color},${currentTopic.color}cc)`}}>
              {isLastTopic?"🏁 Selesai & Lihat Skor":"Topik Berikutnya →"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if(phase==="result" && result) {
    const pct = Math.round(result.totalScore*100);
    const grade = pct>=85?"🌟 Luar Biasa!":pct>=70?"✅ Bagus!":pct>=55?"📈 Cukup":pct>=40?"⚠️ Perlu Latihan":"❗ Perlu Banyak Latihan";
    const gradeColor = pct>=85?"var(--grn)":pct>=70?"#00897b":pct>=55?"var(--org)":pct>=40?"#ff9800":"var(--red)";
    return (
      <div style={{maxWidth:600,margin:"0 auto"}}>
        <div className="card" style={{textAlign:"center",padding:36}}>
          <div style={{fontSize:64,marginBottom:12}}>🎯</div>
          <div style={{fontFamily:"var(--fh)",fontSize:24,fontWeight:800,marginBottom:4}}>Hasil Kamu, {user.name}!</div>
          <div style={{fontSize:56,fontWeight:800,color:gradeColor,margin:"16px 0",fontFamily:"var(--fh)"}}>{pct}%</div>
          <div style={{fontSize:20,fontWeight:700,color:gradeColor,marginBottom:24}}>{grade}</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:28,textAlign:"left"}}>
            {SENSORY_TOPICS.map(t=>{
              const ts=result.topicScores?.[t.id];
              const tpct=ts!=null?Math.round(ts*100):null;
              const contrib=ts!=null?Math.round(ts*t.weight*100):0;
              return <div key={t.id} style={{background:"#f5faff",borderRadius:12,padding:"14px 16px",border:"1.5px solid var(--bdr)"}}>
                <div className="row" style={{marginBottom:6}}>
                  <span style={{fontWeight:700,fontSize:13}}>{t.emoji} {t.label}</span>
                  <span style={{fontSize:11,color:"var(--mut)",fontWeight:600}}>Bobot {Math.round(t.weight*100)}%</span>
                  <div className="sp"/>
                  <span style={{fontWeight:800,fontSize:15,color:tpct===null?"var(--mut)":tpct>=70?"var(--grn)":tpct>=50?"var(--org)":"var(--red)"}}>{tpct!=null?tpct+"%":"—"}</span>
                </div>
                <div className="pb"><div className="pf" style={{width:`${tpct||0}%`,background:t.color}}/></div>
                <div style={{fontSize:11,color:"var(--mut)",marginTop:4,fontWeight:600}}>Kontribusi ke total: <strong style={{color:t.color}}>{contrib}%</strong></div>
              </div>;
            })}
          </div>
          <button className="btn btn-p" style={{width:"100%",justifyContent:"center"}} onClick={()=>setPhase("intro")}>🔄 Ulangi Quiz</button>
        </div>
      </div>
    );
  }
  return null;
}

// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
